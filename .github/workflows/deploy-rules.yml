# Sends database.rules.json to Firebase (project live-drill) whenever the rules change.
# Needs one repository secret: FIREBASE_SERVICE_ACCOUNT (the private key file from Firebase > Project settings > Service accounts).
name: Deploy Firebase rules

on:
  push:
    branches: [main]
    paths:
      - database.rules.json
      - firebase.json
      - .github/workflows/deploy-rules.yml
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Write the Firebase key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "::error::Add the FIREBASE_SERVICE_ACCOUNT secret in Settings > Secrets and variables > Actions"; exit 1; fi
          printf '%s' "$SA" > "$RUNNER_TEMP/sa.json"
      - name: Deploy database rules
        env:
          GOOGLE_APPLICATION_CREDENTIALS: ${{ runner.temp }}/sa.json
        run: npx --yes firebase-tools@13 deploy --only database --project live-drill --non-interactive
      - name: Remove the key
        if: always()
        run: rm -f "$RUNNER_TEMP/sa.json"
