@font-face{font-family:'Meridian';font-weight:600;font-display:swap;src:url(fonts/meridian-600.woff) format('woff')}@font-face{font-family:'Meridian';font-weight:700;font-display:swap;src:url(fonts/meridian-700.woff) format('woff')}@font-face{font-family:'Meridian';font-weight:800 900;font-display:swap;src:url(fonts/meridian-800.woff) format('woff')}@font-face{font-family:'Meridian Text';font-weight:300 500;font-display:swap;src:url(fonts/meridian-text-400.woff) format('woff')}@font-face{font-family:'Meridian Text';font-weight:600;font-display:swap;src:url(fonts/meridian-text-600.woff) format('woff')}@font-face{font-family:'Meridian Text';font-weight:700 900;font-display:swap;src:url(fonts/meridian-text-700.woff) format('woff')}






:root{--navy:#0b1630;--navy2:#13244a;--gold:#f5b800;--ink:#eef2fa;--soft:#a5b0c7;--panel:rgba(9,16,34,.86);--line:rgba(255,255,255,.12);--green:#22c55e;--red:#ef4444;--blue:#3b82f6;--safe-b:env(safe-area-inset-bottom,0px);--safe-t:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#0d1422;color:var(--ink);font:15px/1.4 'Meridian Text',system-ui,sans-serif;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
canvas#view{position:fixed;inset:0;touch-action:none;display:block}
.cond{font-family:'Meridian',sans-serif}
/* HUD */
.hTop{position:fixed;left:8px;right:8px;top:calc(8px + var(--safe-t));display:flex;gap:8px;align-items:flex-start;pointer-events:none;z-index:5}
.hTop>*{pointer-events:auto}
.wkM{margin:2px 0 10px;padding:0;list-style:none;display:grid;gap:6px}.wkM li{border-left:3px solid #f5b800;padding:4px 0 4px 10px;font-size:.86rem;display:grid;gap:1px}.wkM small{opacity:.65;font-size:.7rem}.wkTiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px;margin:4px 0 10px}.wkT{background:rgba(255,255,255,.05);border:1px solid var(--line);border-radius:12px;padding:10px;display:grid;gap:2px}.wkT b{font-size:1.25rem}.wkT b i{font-style:normal;opacity:.4;margin:0 4px}.wkT small{opacity:.75;font-size:.72rem}.wkPs{display:grid;gap:6px;margin-bottom:8px}.wkP{display:grid;grid-template-columns:80px 1fr auto;gap:8px;align-items:center;font-size:.82rem}.wkP u{height:6px;border-radius:4px;background:rgba(255,255,255,.1);text-decoration:none;overflow:hidden}.wkP s{display:block;height:100%;width:var(--w);background:#f5b800;text-decoration:none}.wkP.good s{background:#22c55e}.wkP.short s{background:#ef4444}.wkP small{opacity:.75}.wkS{border:1px solid var(--line);border-radius:12px;margin:6px 0;padding:8px 10px;background:rgba(255,255,255,.03)}.wkS summary{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;cursor:pointer;list-style:none}.wkS summary::-webkit-details-marker{display:none}.wkG{grid-row:span 3;width:34px;height:34px;border-radius:9px;display:grid;place-items:center;font-weight:800;background:#334155}.wkG.gS{background:#f5b800;color:#111}.wkG.gA{background:#22c55e;color:#062}.wkG.gB{background:#38bdf8;color:#03263a}.wkG.gC{background:#a78bfa}.wkS small{opacity:.7}.wkS em{font-style:normal;font-size:.82rem;opacity:.9}.wkS ol{margin:8px 0 2px 18px;padding:0;font-size:.8rem;opacity:.9;display:grid;gap:3px}
.hPtn{display:flex;align-items:center;gap:5px;font-size:11px;line-height:1.2;margin-top:2px;opacity:.92}.hPtn[hidden]{display:none}.hPtn b{font-weight:700}.hPtn .pip{display:inline-flex;gap:2px;text-decoration:none}.hPtn .pip i{width:6px;height:6px;border-radius:2px;background:rgba(255,255,255,.18)}.hPtn.good .pip i.on{background:#22c55e}.hPtn.even .pip i.on{background:#f5b800}.hPtn.short .pip i.on{background:#ef4444}.hPtn em{font-style:normal;opacity:.75}.hPtn.up{animation:ptnUp 1.6s ease-out}.hPtn.dn{animation:ptnDn 1.6s ease-out}@keyframes ptnUp{0%,30%{color:#4ade80;transform:scale(1.08)}100%{color:inherit;transform:none}}@keyframes ptnDn{0%,30%{color:#f87171;transform:translateX(-2px)}15%{transform:translateX(2px)}100%{color:inherit;transform:none}}
.hCard{background:var(--panel);border:1px solid var(--line);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hMe{display:flex;align-items:center;gap:10px;padding:7px 12px 7px 7px;min-width:0;flex:0 1 auto}
.hRing{--p:0;flex:none;width:44px;height:44px;border-radius:50%;background:conic-gradient(var(--gold) calc(var(--p)*1%),rgba(255,255,255,.12) 0);display:grid;place-items:center}
.hRing span{width:34px;height:34px;border-radius:50%;background:var(--navy);display:grid;place-items:center;font:800 .8rem 'Meridian','Arial Narrow',system-ui,sans-serif}
.hId{min-width:0;display:grid;line-height:1.15}
.hId b{font:800 1.05rem 'Meridian','Arial Narrow',system-ui,sans-serif;letter-spacing:.02em;white-space:nowrap}
#hUnit{--uc:#f5b800;font-size:.72rem;font-weight:700;color:var(--uc);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;filter:brightness(1.35)}
#hRank{font-size:.72rem;color:var(--soft);white-space:nowrap}
.hShift{margin-left:auto;padding:7px 12px;text-align:right;display:grid;line-height:1.2}
#hClock{font:800 1rem 'Meridian','Arial Narrow',system-ui,sans-serif;letter-spacing:.03em;white-space:nowrap}
#hDist{--dc:#f5b800;font-size:.74rem;font-weight:700;color:var(--dc);white-space:nowrap}
#hOn{font-size:.7rem;color:var(--soft)}
#hOn::before{content:'';display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);margin-right:5px;vertical-align:1px}
/* radio feed */
#radio{position:fixed;left:8px;top:calc(72px + var(--safe-t));max-width:min(420px,calc(100% - 140px));padding:6px 10px;font-size:.78rem;line-height:1.35;z-index:4;pointer-events:none;background:linear-gradient(90deg,rgba(9,16,34,.78),rgba(9,16,34,0));border-radius:10px}
#radio div{text-shadow:0 1px 2px var(--deep);margin:1px 0;opacity:.92}
#radio div:last-child{opacity:1}
#radio b{color:var(--gold)}
/* minimap */
.mini{position:fixed;right:8px;top:calc(72px + var(--safe-t));width:116px;height:116px;border-radius:50%;overflow:hidden;border:2px solid var(--line);background:#0b1220;z-index:4}
.mini canvas{width:100%;height:100%;display:block}
/* call card */
#callCard{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + var(--safe-b));width:min(440px,calc(100% - 16px));padding:10px 12px;z-index:6;border-left:5px solid var(--gold);background:var(--panel);border-radius:14px;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);animation:pop .25s ease-out}
#callCard.p1{border-left-color:var(--red);box-shadow:0 0 0 1px rgba(239,68,68,.4),0 8px 30px -8px rgba(239,68,68,.6)}
.ccTop{display:flex;justify-content:space-between;gap:8px;font-size:.7rem;letter-spacing:.06em;color:var(--soft)}
.ccTop b{color:var(--gold)} .p1 .ccTop b{color:var(--red)}
.ccTop span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ccT{font:800 1.2rem/1.15 'Meridian','Arial Narrow',system-ui,sans-serif;margin:2px 0}
.ccW{font-size:.82rem;color:var(--soft)}
.ccB{display:flex;gap:8px;margin-top:8px}
.ccB button{flex:1;min-height:42px;border-radius:10px;background:var(--gold);color:var(--navy);font-weight:800}
.ccB button.ghost{background:rgba(255,255,255,.08);color:var(--ink);border:1px solid var(--line);font-weight:600}
@keyframes pop{from{opacity:0;transform:translate(-50%,10px)}}
/* bottom bar */
.hBot{position:fixed;left:8px;right:8px;bottom:calc(8px + var(--safe-b));display:flex;gap:6px;justify-content:center;z-index:5}
.hBot button{min-width:58px;min-height:58px;padding:6px 8px;border-radius:14px;background:var(--panel);border:1px solid var(--line);display:grid;place-items:center;gap:2px;font-size:.72rem;font-weight:700;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.hBot button i{font-style:normal;font-size:1.2rem;line-height:1}
.hBot button.on{background:var(--gold);color:var(--navy);border-color:var(--gold)}
.zoom{position:fixed;right:8px;bottom:calc(84px + var(--safe-b));display:grid;gap:6px;z-index:5}
.zoom button{width:42px;height:42px;border-radius:12px;background:var(--panel);border:1px solid var(--line);font-size:1.2rem;font-weight:700}
#quick{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + var(--safe-b));width:min(460px,calc(100% - 16px));max-height:min(70vh,560px);display:flex;flex-direction:column;gap:6px;padding:10px;z-index:9;background:rgba(9,16,34,.95);border:1px solid rgba(245,184,0,.4);border-radius:16px;box-shadow:0 20px 50px -12px var(--deep);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px)}
.chHead{display:flex;align-items:center;gap:8px}.chHead b{flex:1;font:800 1.05rem 'Meridian','Arial Narrow',system-ui,sans-serif;letter-spacing:.02em}.chHead span{font-size:.72rem;color:var(--soft)}.chHead button{width:34px;height:34px;border-radius:10px;font-size:1.3rem;background:rgba(255,255,255,.06)}
.chList{flex:1;min-height:120px;overflow-y:auto;display:grid;align-content:start;gap:6px;padding:4px 2px;overscroll-behavior:contain}
.chMsg{position:relative;justify-self:start;max-width:86%;padding:6px 10px;border-radius:12px 12px 12px 4px;background:rgba(255,255,255,.07);display:grid;gap:1px}
.chMsg b{font-size:.72rem;color:#f5b800}.chMsg b i{font-style:normal;color:#93c5fd;margin-left:4px}.chMsg span{font-size:.92rem;line-height:1.35;word-break:break-word}
.chMsg.me{justify-self:end;border-radius:12px 12px 4px 12px;background:rgba(245,184,0,.16)}.chMsg.me b{color:#fde68a}
.chMute{position:absolute;right:-30px;top:4px;width:26px;height:26px;border-radius:8px;font-size:.8rem;opacity:.5}.chMute:hover{opacity:1}
.chEmpty{color:var(--soft);font-size:.86rem;text-align:center;margin:20px 0}
.chQuick{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none}.chQuick button{flex:none;min-height:34px;padding:0 12px;border-radius:99px;background:rgba(255,255,255,.07);border:1px solid var(--line);font-weight:700;font-size:.8rem;white-space:nowrap}
.chForm{display:flex;gap:6px}.chForm input{flex:1;min-width:0;min-height:44px;border-radius:12px;border:1.5px solid var(--line);background:#0f1a33;color:var(--ink);font:inherit;padding:0 12px}.chForm input:focus{outline:none;border-color:#f5b800}
.chForm button{min-height:44px;padding:0 16px;border-radius:12px;background:#f5b800;color:#0b1630;font-weight:800}
.chRule{margin:0;font-size:.68rem;color:var(--soft);text-align:center}
#bRadio.rx{animation:rxBlink .9s ease-out}@keyframes rxBlink{0%{box-shadow:0 0 0 0 rgba(56,189,248,.7)}30%{box-shadow:0 0 0 4px rgba(56,189,248,.45)}100%{box-shadow:0 0 0 0 rgba(56,189,248,0)}}
#bRadio.ping{border-color:#f5b800;box-shadow:0 0 0 3px rgba(245,184,0,.35);animation:tiPulse 1.6s ease-in-out infinite}
#toast{position:fixed;left:50%;transform:translateX(-50%);top:calc(196px + var(--safe-t));width:max-content;max-width:calc(100% - 24px);padding:10px 14px;border-radius:12px;background:rgba(9,16,34,.94);border:1px solid var(--gold);font-size:.88rem;font-weight:600;z-index:8;text-align:center;animation:pop .2s ease-out}
/* modal */
#modal{position:fixed;inset:0;z-index:20;background:rgba(4,8,18,.6);display:grid;place-items:center;padding:12px;padding-bottom:calc(12px + var(--safe-b))}
.mBox{width:min(560px,100%);max-height:100%;overflow-y:auto;background:#0f1a33;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 20px 60px -10px var(--deep);animation:mIn .22s ease-out;overscroll-behavior:contain}
@keyframes mIn{from{opacity:0;transform:translateY(12px) scale(.98)}}
.sceneHead{margin:-16px -16px 14px;padding:16px;border-radius:18px 18px 0 0;background:linear-gradient(160deg,#1b2d55,#0b1630);border-bottom:3px solid var(--gold)}
.sceneHead b{font-size:.72rem;letter-spacing:.08em;color:var(--gold)}
.sceneHead h2{margin:4px 0 2px;font:800 1.45rem/1.15 'Meridian','Arial Narrow',system-ui,sans-serif}
.sceneHead p{margin:4px 0 0;color:var(--soft);font-size:.9rem}
.sceneHead.p1{border-bottom-color:var(--red);background:linear-gradient(160deg,#4a1420,#170a14)} .sceneHead.p1 b{color:#fca5a5}
.sceneHead.p2{border-bottom-color:#f59e0b}
.sceneHead.done{border-bottom-color:var(--green);background:linear-gradient(160deg,#123d2a,#0a1d16)} .sceneHead.done b{color:#86efac}
.sceneHead.cit{border-bottom-color:#f5b800} .sceneHead.obs{border-bottom-color:#a855f7} .sceneHead.obs b{color:#d8b4fe}
.sceneHead.info{border-bottom-color:var(--blue)} .sceneHead.info b{color:#93c5fd}
.qProg{display:flex;gap:4px;margin:0 0 10px}.qProg i{flex:1;height:5px;border-radius:3px;background:rgba(255,255,255,.12)}.qProg i.d{background:var(--gold)}.qProg i.c{background:#fff}
.qKind{font-size:.72rem;font-weight:800;letter-spacing:.07em;color:var(--gold);text-transform:uppercase}
.qStem{font-size:1.05rem;line-height:1.5;margin:4px 0 10px}
.qHint{font-size:.8rem;color:var(--soft);margin:-4px 0 8px}
.qOpts{display:grid;gap:8px}
.qOpt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:11px 12px;min-height:50px;border-radius:12px;background:rgba(255,255,255,.05);border:1.5px solid var(--line);line-height:1.4}
.qOpt span{flex:none;width:26px;height:26px;border-radius:8px;display:grid;place-items:center;background:rgba(245,184,0,.14);color:var(--gold);font-weight:800;font-size:.82rem}
.qOpt:hover:not(:disabled){border-color:var(--gold)}
.qOpt.sel{border-color:var(--gold);background:rgba(245,184,0,.1)}
.qOpt.ok{border-color:var(--green);background:rgba(34,197,94,.13)} .qOpt.ok span{background:var(--green);color:#04120a}
.qOpt.no{border-color:var(--red);background:rgba(239,68,68,.12)} .qOpt.no span{background:var(--red);color:#fff}

.fb{margin-top:10px;padding:10px 12px;border-radius:12px;font-size:.9rem;line-height:1.45;background:rgba(255,255,255,.05);border-left:4px solid var(--soft)}
.fb.ok{border-left-color:var(--green)} .fb.no{border-left-color:var(--red)} .fb em{color:var(--soft);font-style:normal;font-size:.8rem}

.dHead{display:flex;justify-content:space-between;gap:8px;align-items:baseline}.dHead b{font:800 1.1rem 'Meridian','Arial Narrow',system-ui,sans-serif}.dHead span{font-size:.76rem;color:var(--soft);text-align:right}

.uTop{display:flex;gap:8px;align-items:center}.uIco{font-size:1.5rem}.uTop div{display:grid;line-height:1.1}.uTop b{font:800 1.12rem 'Meridian','Arial Narrow',system-ui,sans-serif}.uTop em{font-style:normal;font-size:.72rem;color:var(--soft);font-weight:600}

.stCs{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.stCs b{font:800 1.6rem 'Meridian','Arial Narrow',system-ui,sans-serif;letter-spacing:.04em;color:var(--gold)}

.lockBox{max-width:520px;padding-top:6vh}.lockH{font:800 1.8rem/1.1 'Meridian','Arial Narrow',system-ui,sans-serif;margin:6px 0 8px}.lockP{color:var(--soft);line-height:1.55}.lockP b{color:var(--ink)}.lockGo{display:grid;place-items:center;text-decoration:none}

.objBar{position:fixed;left:50%;transform:translateX(-50%);top:calc(70px + var(--safe-t));z-index:6;display:flex;align-items:center;gap:10px;max-width:min(520px,calc(100% - 250px));padding:6px 12px 6px 8px;border-radius:12px;background:linear-gradient(90deg,rgba(245,184,0,.18),rgba(9,16,34,.86) 40%);border:1px solid rgba(245,184,0,.5);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);cursor:default}

.jCh.side{border-left-color:#38bdf8}.jCh.side.done{border-left-color:#22c55e}.jTrack{margin-top:6px;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--soft);font:700 .72rem system-ui;cursor:pointer}.jTrack.on{background:#38bdf8;border-color:#38bdf8;color:#04121f}.jSec .jTrack{margin:0}

/* ===== case files ===== */
.cfBar{position:relative;height:26px;border-radius:13px;background:rgba(255,255,255,.07);overflow:hidden;margin:8px 0}.cfBar i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,#f5b800,#fb923c)}.cfBar span{position:relative;display:block;text-align:center;font:800 .72rem/26px system-ui;letter-spacing:.06em;color:#fff;text-shadow:0 1px 2px var(--deep)}

.cfCard{position:relative;display:flex;flex-direction:column;align-items:center;gap:4px;padding:10px 6px 8px;border-radius:12px;border:1.5px solid var(--r);background:linear-gradient(160deg,hsl(var(--h) 45% 22%),#0b1222 70%);text-align:center;min-height:118px;transition:transform .15s}

.cfBig .cfArt{font-size:3.4rem;width:96px;height:96px;display:grid;place-items:center;border-radius:50%;background:rgba(255,255,255,.08)}.cfBig small{font:800 .66rem system-ui;letter-spacing:.2em;text-transform:uppercase;color:var(--r)}.cfBig h2{margin:0;font:800 1.4rem 'Meridian',system-ui}.cfBig p{margin:0;line-height:1.55;color:#dbe3ef;font-size:.95rem}
/* ===== academy season ===== */
.seTrack{display:grid;grid-auto-flow:column;grid-auto-columns:120px;gap:8px;overflow-x:auto;padding:4px 2px 10px;scroll-snap-type:x mandatory}
.seTier{position:relative;scroll-snap-align:center;display:grid;justify-items:center;gap:4px;padding:10px 8px;border-radius:12px;border:1px solid rgba(255,255,255,.1);background:rgba(255,255,255,.03);text-align:center;opacity:.6}

.kbList button.on{border-color:#f5b800;background:rgba(245,184,0,.12)}.kbList kbd{min-width:34px;padding:3px 8px;border-radius:6px;background:#0b1222;border:1px solid rgba(255,255,255,.2);font:800 .8rem ui-monospace,monospace;color:#f5b800;text-align:center}

/* ===== opening cinematic ===== */
.introCine{position:fixed;inset:0;z-index:55;pointer-events:none;opacity:0;transition:opacity .8s}.introCine.on{opacity:1}.introCine.out{opacity:0}

.icRadio{position:absolute;left:50%;bottom:calc(12vh + 18px);transform:translateX(-50%);width:min(560px,90vw);font:600 .95rem/1.4 ui-monospace,Menlo,monospace;color:#d1fae5;text-shadow:0 2px 6px var(--deep);opacity:0}

.icTitle{position:absolute;inset:0;display:grid;place-content:center;text-align:center;opacity:0;transition:opacity 1.4s}.introCine.title .icTitle{opacity:1}

.introCine.lift .icTitle{opacity:0}.introCine.lift .tcBar{height:0;transition-duration:2.4s}.icHint{position:absolute;left:0;right:0;top:calc(4vh + var(--safe-t,0px));text-align:center;font:700 .8rem 'Meridian',system-ui;letter-spacing:.12em;text-transform:uppercase;color:var(--g1);opacity:0;transition:opacity 1s}.introCine.lift .icHint{opacity:.85}
.icSkip{position:absolute;right:16px;top:calc(12vh + 12px + var(--safe-t,0px));pointer-events:auto;padding:8px 14px;border-radius:99px;border:1px solid rgba(255,255,255,.3);background:rgba(0,0,0,.45);color:#fff;font:700 .78rem system-ui;letter-spacing:.06em}
/* ===== clue card and mystery board ===== */
.clueCard{display:grid;justify-items:center;text-align:center;gap:6px;padding:18px;border-radius:16px;background:linear-gradient(170deg,#3b2f1e,#1a140c);border:1px solid #a16207;box-shadow:inset 0 0 40px rgba(0,0,0,.5)}
.clueCard span{font-size:2.8rem;animation:gIn .7s cubic-bezier(.2,1.6,.4,1) both}.clueCard small{font:800 .66rem system-ui;letter-spacing:.22em;color:#fbbf24}.clueCard h2{margin:0;font:800 1.5rem 'Meridian Text',sans-serif;color:#fef3c7}.clueCard p{margin:0;font-family:'Meridian Text',system-ui,sans-serif;font-style:italic;color:#fde68a;line-height:1.55}.clueCard em{font-style:normal;font-size:.78rem;color:#d6d3d1}
.mbGrid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;max-height:52vh;overflow-y:auto;padding:10px;border-radius:14px;background:repeating-linear-gradient(45deg,#4a3b28 0 6px,#45372a 6px 12px);box-shadow:inset 0 0 30px rgba(0,0,0,.5)}

.gcRoll h1{font:900 3.4rem 'Meridian',system-ui;letter-spacing:.08em;margin:0;color:#fff}.gcSub{color:#f5b800;letter-spacing:.4em;font-size:.75rem;text-transform:uppercase}

.advis.fbrtp small{font:800 .7rem system-ui;letter-spacing:.4em;color:var(--g3)}.advis.fbrtp h3{font-size:2rem}

.rcSaw{display:flex;flex-wrap:wrap;gap:6px;margin:4px 0 10px}.rcSaw span{display:flex;align-items:center;gap:5px;padding:4px 9px 4px 5px;border-radius:999px;background:rgba(255,255,255,.07);font-size:.72rem;line-height:1.2}.rcSaw i{font-style:normal;font-size:1rem}

.cfQs{list-style:none;margin:0 0 12px;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:6px}.cfQ{padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.1);display:grid;gap:3px}.cfQ b{font-size:.86rem;line-height:1.3}.cfQ span{font-size:.74rem;opacity:.72;line-height:1.35}

.cfSearch{display:flex;gap:6px;margin:0 0 6px;position:sticky;top:0;z-index:2}.cfSearch input{flex:1;min-width:0;font:inherit;padding:9px 12px;border-radius:10px;border:1px solid rgba(253,230,138,.45);background:#141824;color:#fff}.cfSearch button{padding:0 16px}

.mbThread{display:grid;grid-template-columns:auto 1fr;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08)}.mbThread i{font-style:normal}.mbThread span{display:grid;gap:2px}.mbThread em{font-style:normal;font-size:.72rem;opacity:.75}.mbThread small{grid-column:2;opacity:.7;font-size:.72rem}.mbThread i{grid-row:span 2;font-size:1.4rem}.mbThread.closed{opacity:.6}

.invScene{position:relative;height:min(52vh,360px);border-radius:14px;overflow:hidden;background:radial-gradient(circle at 30% 20%,var(--a),var(--b));box-shadow:inset 0 0 60px rgba(0,0,0,.6)}
